<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>NEON DODGE</title>
<style>
:root{--bg:#090d18;--panel:#111a2b;--cyan:#54f6ff;--pink:#ff4d9d;--white:#f4f7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at top,#18294a 0%,var(--bg) 58%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;overflow:hidden;touch-action:manipulation}
.wrap{max-width:560px;margin:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));height:100dvh;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:12px;letter-spacing:4px;color:var(--cyan);font-weight:900}
h1{font-size:clamp(30px,8vw,46px);letter-spacing:2px;margin:3px 0 0;font-weight:950}
.stats{display:flex;gap:8px}
.stat{background:#111a2bcc;border:1px solid #ffffff14;border-radius:14px;padding:9px 12px;text-align:center;min-width:78px}
.stat small{display:block;color:#8fa1c2;font-size:10px;letter-spacing:1.5px}
.stat strong{font-size:21px}
.board{position:relative;flex:1;min-height:280px;border:1px solid #54f6ff38;border-radius:22px;overflow:hidden;background:linear-gradient(#0b1426d9,#080c17f2);box-shadow:0 0 40px #00d9ff0d,inset 0 0 40px #54f6ff08}
canvas{width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#080d18b8;backdrop-filter:blur(5px)}
.overlay.hidden{display:none}
.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:3px;font-weight:800}
.overlay h2{font-size:32px;margin:10px 0}
.overlay p{color:#b5c3df;line-height:1.5;max-width:300px;margin:0 0 20px}
button{border:0;font:inherit;font-weight:850;cursor:pointer}
.mainbtn{color:#071018;background:var(--cyan);border-radius:14px;padding:15px 26px;box-shadow:0 0 24px #54f6ff38}
.controls{display:flex;gap:10px}
.ctrl{flex:1;border:1px solid #54f6ff38;border-radius:16px;background:var(--panel);color:var(--white);padding:17px 8px;font-size:18px}
.ctrl:active{background:#20334b;transform:scale(.98)}
.hint{text-align:center;color:#7183a5;font-size:12px;margin:0}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><div class="logo">ARCADE / 001</div><h1>NEON DODGE</h1></div>
 <div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div>
</header>
<div class="board" id="board">
 <canvas id="game"></canvas>
 <div class="overlay" id="overlay">
  <div class="eyebrow">SURVIVE THE NIGHT</div>
  <h2 id="overlayTitle">Не попадайся.</h2>
  <p id="overlayText">Управляй неоновым кораблём и уворачивайся от красных блоков. Чем дольше живёшь — тем быстрее игра.</p>
  <button class="mainbtn" id="start">НАЧАТЬ ИГРУ</button>
 </div>
</div>
<div class="controls"><button class="ctrl" id="left" aria-label="Влево">◀ ВЛЕВО</button><button class="ctrl" id="right" aria-label="Вправо">ВПРАВО ▶</button></div>
<p class="hint">Можно также двигать корабль пальцем по игровому полю.</p>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),board=document.getElementById('board');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay');
let W=0,H=0,player,blocks,particles,score,best=Number(localStorage.getItem('neonDodgeBest')||0),running=false,last=0,spawn=0,speed=170,keys={left:false,right:false},stars=[];
bestEl.textContent=best;
function resize(){const r=board.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.3,a:Math.random()*.5+.15}));if(!player)reset();}
function reset(){player={x:W/2,y:H-42,w:24,h:28};blocks=[];particles=[];score=0;spawn=0;speed=170;scoreEl.textContent='0';}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop);}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonDodgeBest',best);bestEl.textContent=best;document.getElementById('overlayTitle').textContent='Игра окончена';document.getElementById('overlayText').textContent=`Твой результат: ${Math.floor(score)}. Рекорд: ${best}. Ещё одна попытка?`;document.getElementById('start').textContent='ЕЩЁ РАЗ';overlay.classList.remove('hidden');}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();requestAnimationFrame(loop);}
function update(dt){
 score+=dt*10;scoreEl.textContent=Math.floor(score);speed=170+Math.min(score*1.8,230);
 if(keys.left)player.x-=260*dt;if(keys.right)player.x+=260*dt;player.x=Math.max(player.w/2+5,Math.min(W-player.w/2-5,player.x));
 spawn-=dt;if(spawn<=0){const w=22+Math.random()*35;blocks.push({x:Math.random()*(W-w),y:-35,w,h:18+Math.random()*18,v:speed*(.75+Math.random()*.55)});spawn=Math.max(.22,.68-score/180)+Math.random()*.25;}
 for(const b of blocks){b.y+=b.v*dt;if(player.x+player.w*.38>b.x&&player.x-player.w*.38<b.x+b.w&&player.y+player.h*.35>b.y&&player.y-player.h*.35<b.y+b.h){for(let i=0;i<20;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,life:.7});end();return;}}
 blocks=blocks.filter(b=>b.y<H+40);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle=`rgba(150,220,255,${s.a})`;ctx.fillRect(s.x,s.y,s.s,s.s);}
 ctx.strokeStyle='#54f6ff0b';ctx.lineWidth=1;for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 for(const b of blocks){ctx.shadowBlur=14;ctx.shadowColor='#ff4d9d';ctx.fillStyle='#ff4d9d';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd5e7';ctx.fillRect(b.x+4,b.y+4,Math.max(0,b.w-8),2);}
 if(player){ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=20;ctx.shadowColor='#54f6ff';ctx.fillStyle='#54f6ff';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(13,12);ctx.lineTo(0,7);ctx.lineTo(-13,12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-2,-7,4,11);ctx.restore();}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#54f6ff';ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;
}
function hold(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true;};const off=e=>{e.preventDefault();keys[key]=false;};el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));}
hold('left','left');hold('right','right');
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;});
let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);move(e);});canvas.addEventListener('pointermove',e=>{if(dragging)move(e);});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
function move(e){if(!player)return;const r=canvas.getBoundingClientRect();player.x=e.clientX-r.left;}
document.getElementById('start').addEventListener('click',start);
window.addEventListener('resize',resize);resize();reset();draw();
})();
</script>
</body></html>
